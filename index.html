<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Astro Sketchbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B1026; --panel: #161B3D; --panel-hi: #1F2650; --sun: #FF8B5E; --sun-soft: #FFB088;
    --dusk: #6C63AC; --cream: #F5F0E6; --teal: #4ECDC4; --line: #2C3468; --danger: #FF6B6B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;color:var(--cream);
    font-family:'Nunito',sans-serif; overscroll-behavior:none;}
  body{min-height:100vh; padding-bottom:50px;
    background:
      radial-gradient(ellipse 80% 50% at 20% -10%, rgba(108,99,172,0.55), transparent),
      radial-gradient(ellipse 60% 40% at 90% 10%, rgba(255,139,94,0.18), transparent),
      radial-gradient(ellipse 70% 60% at 50% 100%, rgba(78,205,196,0.12), transparent),
      var(--bg);
    background-attachment: fixed;}
  #stars{position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.5;}
  .app{position:relative; z-index:1; max-width:760px; margin:0 auto; padding:26px 18px 60px;}

  .hero{text-align:center; margin-bottom:22px; position:relative;}
  .hero .logo{font-size:2.6rem; line-height:1;}
  .hero h1{font-family:'Baloo 2'; font-weight:800; font-size:1.6rem; margin:8px 0 4px;}
  .hero p{font-size:0.85rem; color:#B9C0EA; margin:0;}
  .deco-planet{position:absolute; top:-18px; right:6%; width:46px; height:46px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #FFB088, #FF8B5E 60%, #b85c34 100%);
    box-shadow:0 0 18px rgba(255,139,94,0.5); animation: float 5s ease-in-out infinite;}
  .deco-planet::after{content:''; position:absolute; top:50%; left:-14%; width:128%; height:8px;
    background:rgba(245,240,230,0.55); border-radius:50%; transform:rotate(-14deg) translateY(-50%);}
  .deco-moon{position:absolute; top:6px; left:8%; width:22px; height:22px; border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #F5F0E6, #cfc9ba 75%);
    box-shadow:0 0 10px rgba(245,240,230,0.4); animation: float 4s ease-in-out infinite reverse;}
  @keyframes float{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }

  .totals{display:flex; justify-content:center; gap:10px; margin:16px 0 26px; flex-wrap:wrap;}
  .total-pill{background:var(--panel-hi); border:1px solid var(--line); border-radius:999px;
    padding:8px 16px; font-family:'Baloo 2'; font-weight:700; font-size:0.85rem; color:var(--teal);}

  .module{margin-bottom:26px;}
  .module-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; padding:0 2px;}
  .module-head h2{font-family:'Baloo 2'; font-size:1.05rem; margin:0; color:var(--sun-soft);}
  .module-head .count{font-size:0.75rem; color:#8A92C7;}

  .card-row{display:flex; gap:10px; overflow-x:auto; padding:2px 2px 10px; scrollbar-width:none;}
  .card-row::-webkit-scrollbar{display:none;}

  .card{flex:0 0 auto; width:118px; background:var(--panel); border:2px solid var(--line);
    border-radius:16px; padding:14px 10px; text-align:center; text-decoration:none; color:var(--cream);
    transition: transform .12s, border-color .12s;}
  .card:active{transform:scale(0.96);}
  .card .ic{font-size:1.6rem; margin-bottom:6px;}
  .card .name{font-family:'Baloo 2'; font-weight:700; font-size:0.78rem; line-height:1.15; min-height:2.3em;
    display:flex; align-items:center; justify-content:center;}
  .card .status{font-size:0.65rem; margin-top:6px; font-weight:700;}

  .card.built{border-color:var(--dusk);}
  .card.mastered{border-color:var(--teal);}
  .card.mastered .status{color:var(--teal);}
  .card.built .status{color:var(--sun-soft);}
  .card.soon{opacity:0.4; border-style:dashed; cursor:default; pointer-events:none;}
  .card.soon .status{color:#8A92C7;}

  footer{text-align:center; font-size:0.72rem; color:#5C6499; margin-top:20px;}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="app">
  <div class="hero">
    <div class="deco-planet"></div>
    <div class="deco-moon"></div>
    <div class="logo">🔭</div>
    <h1>Astro Sketchbook</h1>
    <p>TAO exam prep · sketch, spin, connect the sky</p>
  </div>

  <div class="totals">
    <div class="total-pill" id="xpTotal">⭐ 0 XP</div>
    <div class="total-pill" id="masteredTotal">🏆 0 mastered</div>
  </div>

  <div id="modules"></div>

  <footer>More concepts unlock here as they're built — this page updates automatically.</footer>
</div>

<script>
/* ============================================================
   MODULE DATA
   href: null  -> "coming soon" card (greyed out, not clickable)
   href: "x.html" -> real concept, progress read from its localStorage save
   saveId: must match the CONCEPT.id used inside that concept's file
   ============================================================ */
const MODULES = [
  {
    key: 'A1', title: 'A1 · Earth Basics',
    concepts: [
      {icon:'🌍', name:'Earth', href:'earth-basics-earth.html', saveId:'earth'},
      {icon:'📍', name:'Earth Axis', href:'earth-axis.html', saveId:'earthaxis'},
      {icon:'➖', name:'Equator', href:'equator.html', saveId:'equator'},
      {icon:'⬆️', name:'North Pole', href:'north-pole.html', saveId:'northpole'},
      {icon:'⬇️', name:'South Pole', href:'south-pole.html', saveId:'southpole'},
      {icon:'↔️', name:'Latitude', href:'latitude.html', saveId:'latitude'},
      {icon:'↕️', name:'Longitude', href:'longitude.html', saveId:'longitude'},
      {icon:'🌗', name:'Hemisphere', href:'hemisphere.html', saveId:'hemisphere'},
      {icon:'🗺️', name:'Globe vs Map', href:'globe-vs-map.html', saveId:'globevsmap'},
      {icon:'🧭', name:'Compass', href:'compass.html', saveId:'compass'},
    ]
  },
  {
    key: 'A2', title: 'A2 · Day & Night',
    concepts: [
      {icon:'🔄', name:'Earth Spins', href:'earth-spins.html', saveId:'earthspins'},
      {icon:'☀️', name:'Day', href:'day.html', saveId:'day'},
      {icon:'🌙', name:'Night', href:'night.html', saveId:'night'},
      {icon:'🌅', name:'Sunrise', href:'sunrise.html', saveId:'sunrise'},
      {icon:'🌇', name:'Sunset', href:'sunset.html', saveId:'sunset'},
      {icon:'🕛', name:'Noon', href:'noon.html', saveId:'noon'},
      {icon:'🌃', name:'Midnight', href:'midnight.html', saveId:'midnight'},
      {icon:'🌑', name:'Shadow', href:'shadow.html', saveId:'shadow'},
      {icon:'🕐', name:'Time Zone', href:'timezone.html', saveId:'timezone'},
      {icon:'🌍', name:'Earth Rotation', href:'earth-rotation-prototype.html', saveId:'earthrotation'},
    ]
  },
  {
    key: 'A3', title: 'A3 · Seasons',
    concepts: [
      {icon:'🛰️', name:'Earth Orbit', href:'earth-orbit.html', saveId:'earthorbit'},
      {icon:'📐', name:'Tilt', href:'tilt.html', saveId:'tilt'},
      {icon:'☀️', name:'Summer', href:'summer.html', saveId:'summer'},
      {icon:'❄️', name:'Winter', href:'winter.html', saveId:'winter'},
      {icon:'🌸', name:'Spring', href:'spring.html', saveId:'spring'},
      {icon:'🍂', name:'Autumn', href:'autumn.html', saveId:'autumn'},
      {icon:'📅', name:'Solstice', href:'solstice.html', saveId:'solstice'},
      {icon:'⚖️', name:'Equinox', href:'equinox.html', saveId:'equinox'},
      {icon:'📏', name:'Sun Angle', href:'sun-angle.html', saveId:'sunangle'},
      {icon:'⏱️', name:'Day Length', href:'day-length.html', saveId:'daylength'},
    ]
  },
  {
    key: 'A4', title: 'A4 · Moon',
    concepts: [
      {icon:'🌕', name:'Full Moon', href:'full-moon.html', saveId:'fullmoon'},
      {icon:'🌑', name:'New Moon', href:'new-moon.html', saveId:'newmoon'},
      {icon:'🌙', name:'Crescent', href:'crescent.html', saveId:'crescent'},
      {icon:'🌓', name:'Quarter', href:'quarter.html', saveId:'quarter'},
      {icon:'🌔', name:'Gibbous', href:'gibbous.html', saveId:'gibbous'},
      {icon:'📈', name:'Waxing', href:'waxing.html', saveId:'waxing'},
      {icon:'📉', name:'Waning', href:'waning.html', saveId:'waning'},
      {icon:'🛰️', name:'Moon Orbit', href:'moon-orbit.html', saveId:'moonorbit'},
      {icon:'🌛', name:'Moonrise', href:'moonrise.html', saveId:'moonrise'},
      {icon:'🌜', name:'Moonset', href:'moonset.html', saveId:'moonset'},
      {icon:'🌘', name:'Lunar Eclipse', href:'lunar-eclipse.html', saveId:'lunareclipse'},
      {icon:'🌞', name:'Solar Eclipse', href:'solar-eclipse.html', saveId:'solareclipse'},
      {icon:'🌊', name:'Tides', href:'tides.html', saveId:'tides'},
      {icon:'🌎', name:'Earth-Moon System', href:'earth-moon-system.html', saveId:'earthmoonsystem'},
      {icon:'🕳️', name:'Moon Crater', href:'moon-crater.html', saveId:'mooncrater'},
    ]
  },
  {
    key: 'A5', title: 'A5 · Solar System',
    concepts: [
      {icon:'☀️', name:'Sun', href:null}, {icon:'☿️', name:'Mercury', href:null},
      {icon:'♀️', name:'Venus', href:null}, {icon:'🌍', name:'Earth', href:null},
      {icon:'♂️', name:'Mars', href:null}, {icon:'♃', name:'Jupiter', href:null},
      {icon:'♄', name:'Saturn', href:null}, {icon:'♅', name:'Uranus', href:null},
      {icon:'♆', name:'Neptune', href:null}, {icon:'💫', name:'Asteroid Belt', href:null},
      {icon:'🪐', name:'Kuiper Belt', href:null}, {icon:'☄️', name:'Comet', href:null},
      {icon:'🌠', name:'Meteor', href:null}, {icon:'🪨', name:'Meteorite', href:null},
      {icon:'🔹', name:'Dwarf Planet', href:null}, {icon:'⭕', name:'Orbit', href:null},
      {icon:'🔁', name:'Revolution', href:null}, {icon:'🔄', name:'Rotation', href:null},
      {icon:'🌌', name:'Gravity', href:null}, {icon:'📏', name:'Scale of Solar System', href:null},
    ]
  },
  {
    key: 'A6', title: 'A6 · Sky Observation',
    concepts: [
      {icon:'🌅', name:'Horizon', href:null}, {icon:'⬆️', name:'Zenith', href:null},
      {icon:'📐', name:'Altitude', href:null}, {icon:'🧭', name:'Azimuth', href:null},
      {icon:'⭐', name:'Polaris', href:null}, {icon:'✨', name:'Big Dipper', href:null},
      {icon:'✨', name:'Orion', href:null}, {icon:'🌌', name:'Milky Way', href:null},
      {icon:'✨', name:'Constellation', href:null}, {icon:'🌐', name:'Celestial Sphere', href:null},
      {icon:'↔️', name:'East-West Motion', href:null}, {icon:'🔄', name:'Circumpolar Stars', href:null},
      {icon:'🌠', name:'Star Trail', href:null}, {icon:'🔭', name:'Telescope', href:null},
      {icon:'🔎', name:'Binocular', href:null},
    ]
  },
];

const MISSION_COUNT = 8;

function getConceptSave(saveId){
  try{
    const raw = localStorage.getItem('astro_' + saveId + '_v1');
    if(!raw) return {xp:0, done:0};
    const parsed = JSON.parse(raw);
    const done = Object.values(parsed.done || {}).filter(Boolean).length;
    return {xp: parsed.xp || 0, done};
  } catch(e){ return {xp:0, done:0}; }
}

function renderModules(){
  const root = document.getElementById('modules');
  root.innerHTML = '';
  let totalXP = 0, totalMastered = 0;

  MODULES.forEach(mod=>{
    const builtCount = mod.concepts.filter(c=>c.href).length;
    const section = document.createElement('div');
    section.className = 'module';
    section.innerHTML = `
      <div class="module-head">
        <h2>${mod.title}</h2>
        <span class="count">${builtCount}/${mod.concepts.length} built</span>
      </div>
      <div class="card-row"></div>
    `;
    const row = section.querySelector('.card-row');

    mod.concepts.forEach(c=>{
      if(c.href){
        const save = getConceptSave(c.saveId);
        totalXP += save.xp;
        const mastered = save.done >= MISSION_COUNT;
        if(mastered) totalMastered++;
        const a = document.createElement('a');
        a.href = c.href;
        a.className = 'card built' + (mastered ? ' mastered' : '');
        a.innerHTML = `
          <div class="ic">${c.icon}</div>
          <div class="name">${c.name}</div>
          <div class="status">${mastered ? '🏆 Mastered' : save.done + '/' + MISSION_COUNT}</div>
        `;
        row.appendChild(a);
      } else {
        const d = document.createElement('div');
        d.className = 'card soon';
        d.innerHTML = `
          <div class="ic">${c.icon}</div>
          <div class="name">${c.name}</div>
          <div class="status">Coming soon</div>
        `;
        row.appendChild(d);
      }
    });
    root.appendChild(section);
  });

  document.getElementById('xpTotal').textContent = '⭐ ' + totalXP + ' XP';
  document.getElementById('masteredTotal').textContent = '🏆 ' + totalMastered + ' mastered';
}
renderModules();

/* starfield bg */
(function(){
  const c = document.getElementById('stars');
  function resize(){ c.width = innerWidth; c.height = innerHeight; }
  resize(); window.addEventListener('resize', resize);
  const ctx = c.getContext('2d');
  const stars = Array.from({length:110}, ()=>({
    x:Math.random()*innerWidth,
    y:Math.random()*innerHeight,
    r:Math.random()*1.4+0.3,
    phase:Math.random()*Math.PI*2,
    speed:Math.random()*0.02+0.008,
    big: Math.random() < 0.06
  }));
  function draw(t){
    ctx.clearRect(0,0,c.width,c.height);
    stars.forEach(s=>{
      const twinkle = 0.35 + 0.45 * (0.5 + 0.5*Math.sin(t*s.speed + s.phase));
      ctx.globalAlpha = twinkle;
      ctx.fillStyle = s.big ? '#FFB088' : '#F5F0E6';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.big ? s.r*2.2 : s.r, 0, 7);
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
