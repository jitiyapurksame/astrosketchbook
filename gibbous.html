<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Astro Sketchbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B1026; --panel: #161B3D; --panel-hi: #1F2650; --sun: #FF8B5E; --sun-soft: #FFB088;
    --dusk: #6C63AC; --cream: #F5F0E6; --teal: #4ECDC4; --line: #2C3468; --danger: #FF6B6B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--cream);
    font-family:'Nunito',sans-serif; overscroll-behavior:none; touch-action:manipulation;}
  body{min-height:100vh; padding-bottom:40px;}
  #stars{position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.5;}
  .app{position:relative; z-index:1; max-width:720px; margin:0 auto; padding:18px 16px 60px;}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .concept-title{font-family:'Baloo 2',sans-serif; font-weight:800; font-size:1.5rem; letter-spacing:0.2px;}
  .concept-sub{font-size:0.82rem; color:#B9C0EA; margin-top:2px;}
  .xp-pill{background:var(--panel-hi); border:1px solid var(--line); border-radius:999px;
    padding:7px 14px; font-family:'Baloo 2'; font-weight:700; font-size:0.9rem; color:var(--teal); white-space:nowrap;}
  .rail{display:flex; gap:8px; overflow-x:auto; padding:4px 2px 14px; margin-bottom:8px; scrollbar-width:none;}
  .rail::-webkit-scrollbar{display:none;}
  .m-btn{flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:4px;
    width:64px; padding:9px 4px; border-radius:16px; background:var(--panel);
    border:2px solid var(--line); color:#8A92C7; font-family:'Baloo 2'; font-size:0.62rem;
    font-weight:700; cursor:pointer; transition:all .15s;}
  .m-btn .ic{font-size:1.3rem; line-height:1;}
  .m-btn.active{background:var(--panel-hi); border-color:var(--sun); color:var(--sun-soft); transform:translateY(-2px);}
  .m-btn.done{border-color:var(--teal);}
  .stage{background:var(--panel); border:1px solid var(--line); border-radius:20px;
    padding:18px 16px 20px; min-height:420px; position:relative; overflow:hidden;}
  .stage h2{font-family:'Baloo 2'; font-size:1.05rem; margin:0 0 4px; color:var(--sun-soft);}
  .stage p.instructions{font-size:0.85rem; color:#C7CDF0; margin:0 0 16px; line-height:1.4;}
  .earth-wrap{display:flex; justify-content:center; margin:8px 0 14px;}
  svg.earth{width:100%; max-width:200px; height:auto; display:block; overflow:visible;}
  .hotspot{cursor:pointer;}
  .hotspot circle.ring{fill:none; stroke:var(--sun); stroke-width:2; stroke-dasharray:3 3; opacity:0; transition:opacity .2s;}
  .hotspot.found circle.ring{opacity:0.9;}
  .hotspot.found circle.dot{fill:var(--teal);}
  .found-list{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; justify-content:center;}
  .found-chip{background:rgba(78,205,196,0.15); border:1px solid var(--teal); color:var(--teal);
    font-size:0.72rem; font-weight:700; padding:5px 10px; border-radius:999px;}
  .popup{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    background:var(--panel-hi); border:2px solid var(--sun); border-radius:16px; padding:16px 18px;
    max-width:260px; z-index:10; box-shadow:0 10px 30px rgba(0,0,0,0.5);}
  .popup h3{margin:0 0 6px; font-family:'Baloo 2'; color:var(--sun-soft); font-size:1rem;}
  .popup p{margin:0; font-size:0.85rem; color:#DDE1F5; line-height:1.4;}
  .popup button{margin-top:12px; background:var(--sun); border:none; color:#231400; font-weight:800;
    padding:7px 16px; border-radius:10px; font-family:'Baloo 2'; cursor:pointer;}
  .label-zone{position:absolute; width:14px; height:14px; border-radius:50%; border:2px dashed #8A92C7;}
  .label-zone.filled{border-style:solid; border-color:var(--teal); background:rgba(78,205,196,0.2);}
  .label-pool{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:18px;}
  .label-chip{background:var(--panel-hi); border:2px solid var(--dusk); color:var(--cream);
    padding:8px 12px; border-radius:12px; font-weight:700; font-size:0.8rem; cursor:grab;}
  .canvas-wrap{position:relative; border-radius:16px; overflow:hidden; border:2px solid var(--line); background:#0E1330;}
  canvas{display:block; width:100%; touch-action:none;}
  .draw-tools{display:flex; gap:8px; margin-top:10px; justify-content:center;}
  .draw-tools button{background:var(--panel-hi); border:1px solid var(--line); color:var(--cream);
    padding:8px 14px; border-radius:10px; font-weight:700; font-size:0.78rem;}
  .mc-options{display:flex; flex-direction:column; gap:10px; margin-top:14px;}
  .mc-opt{background:var(--panel-hi); border:2px solid var(--line); border-radius:14px;
    padding:12px 14px; font-weight:700; font-size:0.88rem; cursor:pointer; text-align:left;}
  .mc-opt.correct{border-color:var(--teal); background:rgba(78,205,196,0.15);}
  .mc-opt.wrong{border-color:var(--danger); background:rgba(255,107,107,0.15);}
  .compare-row{display:flex; gap:14px; justify-content:center; margin-top:10px;}
  .compare-card{background:var(--panel-hi); border:3px solid var(--line); border-radius:16px;
    padding:10px; cursor:pointer; width:47%; min-width:0; overflow:hidden;}
  .compare-card.picked-correct{border-color:var(--teal);}
  .compare-card.picked-wrong{border-color:var(--danger);}
  .chain-pool{display:flex; flex-direction:column; gap:8px; margin-top:6px;}
  .chain-slot{min-height:44px; border:2px dashed #565f9c; border-radius:12px; display:flex;
    align-items:center; padding:0 10px; font-size:0.8rem; color:#8A92C7;}
  .chain-slot.filled{border-style:solid; border-color:var(--teal); color:var(--cream); background:rgba(78,205,196,0.08);}
  .chip-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; justify-content:center;}
  .chain-chip{background:var(--panel-hi); border:2px solid var(--dusk); border-radius:12px;
    padding:8px 12px; font-size:0.78rem; font-weight:700; cursor:pointer;}
  .chain-chip.used{opacity:0.2; pointer-events:none;}
  .chain-chip.wrong-flash{border-color:var(--danger); background:rgba(255,107,107,0.2);}
  .chain-slot .undo{margin-left:auto; font-size:0.68rem; color:#8A92C7; cursor:pointer; text-decoration:underline;}
  textarea{width:100%; min-height:110px; background:var(--panel-hi); border:2px solid var(--line);
    border-radius:14px; color:var(--cream); font-family:'Nunito'; font-size:0.9rem; padding:12px; resize:none;}
  .keyword-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .kw{font-size:0.68rem; padding:4px 9px; border-radius:999px; border:1px solid var(--line); color:#8A92C7; cursor:pointer;}
  .kw.hit{border-color:var(--teal); color:var(--teal); background:rgba(78,205,196,0.12);}
  .kw-hint{font-size:0.78rem; color:#C7CDF0; margin:10px 0 4px;}
  .starter-row{display:flex; flex-direction:column; gap:8px; margin:12px 0;}
  .starter-chip{background:var(--panel-hi); border:2px dashed var(--dusk); color:#C7CDF0;
    padding:9px 12px; border-radius:12px; font-size:0.78rem; text-align:left; cursor:pointer;}
  .slider-row{display:flex; align-items:center; gap:10px; margin-top:6px;}
  input[type=range]{flex:1; accent-color: var(--sun);}
  .time-readout{font-family:'Baloo 2'; font-size:1.6rem; text-align:center; color:var(--sun-soft); margin:6px 0;}
  .phase-label{text-align:center; font-weight:800; font-size:0.95rem; color:var(--teal);}
  .primary-btn{display:block; margin:18px auto 0; background:var(--sun); border:none;
    color:#231400; font-family:'Baloo 2'; font-weight:800; font-size:0.95rem; padding:11px 26px;
    border-radius:14px; cursor:pointer;}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--teal); color:#062B27; font-weight:800; font-family:'Baloo 2';
    padding:10px 20px; border-radius:999px; font-size:0.85rem; opacity:0; transition:opacity .25s;
    pointer-events:none; z-index:50; white-space:nowrap;}
  .toast.show{opacity:1;}
  .complete-banner{margin-top:18px; text-align:center; background:rgba(78,205,196,0.12);
    border:2px solid var(--teal); border-radius:16px; padding:14px 16px; animation:pop .3s ease;}
  .complete-banner p{margin:0 0 10px; font-family:'Baloo 2'; font-weight:700; color:var(--teal); font-size:1rem;}
  @keyframes pop{ from{transform:scale(0.9); opacity:0;} to{transform:scale(1); opacity:1;} }
  .hint-text{font-size:0.78rem; color:var(--sun-soft); margin-top:8px; min-height:18px; text-align:center;}
  .badge-banner{display:none; text-align:center; padding:14px; margin-top:14px;
    background:linear-gradient(135deg, rgba(255,139,94,0.15), rgba(78,205,196,0.15));
    border:2px solid var(--sun); border-radius:16px;}
  .badge-banner.show{display:block;}
  .badge-banner .big{font-size:2rem;}
  .badge-banner .t{font-family:'Baloo 2'; font-weight:800; color:var(--sun-soft); margin-top:4px;}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="app">
  <header>
    <div>
      <div class="concept-title" id="conceptTitle"></div>
      <div class="concept-sub" id="conceptSub"></div>
    </div>
    <div class="xp-pill" id="xpPill">⭐ 0 XP</div>
  </header>
  <div class="rail" id="rail"></div>
  <div class="stage" id="stage"></div>
  <div class="badge-banner" id="badgeBanner">
    <div class="big">🏆</div>
    <div class="t" id="badgeText"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONCEPT CONFIG
   This is the ONLY block that changes between concepts.
   Everything below "ENGINE — do not edit per concept" is shared.
   ============================================================ */
const CONCEPT = {
  id: 'gibbous',
  icon: '🌔',
  title: 'Gibbous',
  subtitle: 'A4 · Moon',

  diagramFn: (opts={})=>{
    const rot = opts.rotation || 0;
    const flip = opts.flip ? -1 : 1;
    const moonPos = opts.moonPos !== undefined ? opts.moonPos : 180;
    const hotspots = opts.hotspots || [];
    const id = opts.id || 'm';
    const R = 42, cx = 100, cy = 100;
    const rad = moonPos * Math.PI/180;
    const dx = R * (1 + Math.cos(rad));
    const shiftRight = moonPos <= 180;
    const litCx = shiftRight ? cx + dx : cx - dx;
    return `
    <svg class="earth" viewBox="0 0 200 200" id="${id}" style="transform:rotate(${rot}deg) scaleX(${flip})">
      <defs><clipPath id="moonclip-${id}"><circle cx="${cx}" cy="${cy}" r="${R}"/></clipPath></defs>
      <circle cx="${cx}" cy="${cy}" r="${R}" fill="#1F2650" stroke="#4a5188" stroke-width="1"/>
      <g clip-path="url(#moonclip-${id})">
        <circle cx="${litCx}" cy="${cy}" r="${R}" fill="#F5F0E6"/>
      </g>
      <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#0B1026" stroke-width="2"/>
      ${hotspots.map(h=>`<g class="hotspot" data-key="${h.key}" transform="translate(${h.x},${h.y})"><circle class="ring" r="12"/><circle class="dot" r="5" fill="#F5F0E6"/></g>`).join('')}
    </svg>`;
  },

  observe: {
    instructions: "Tap each glowing dot to learn about the gibbous phase. Find all to complete this mission.",
    points: [
      {key:'mostlyLit', x:0, y:0, name:'Mostly Lit', fact:"A gibbous Moon is more than half lit, but not fully full."},
      {key:'twoTypes', x:0, y:-60, name:'Waxing and Waning', fact:"There's a waxing gibbous (growing, before Full Moon) and a waning gibbous (shrinking, after Full Moon)."},
      {key:'nearFull', x:55, y:40, name:'Near Full Moon', fact:"Gibbous phases happen right before or right after Full Moon, when most of the disk is lit."},
      {key:'brightNight', x:-55, y:40, name:'Bright in the Sky', fact:"A gibbous Moon is one of the brighter phases, since so much of it is lit."},
    ]
  },

  label: {
    instructions: "Tap a label below, then tap the correct spot on the diagram.",
    targets: [
      {key:'litPart', x:130, y:100, name:'The Large Lit Part'},
      {key:'darkSliver', x:65, y:100, name:'The Thin Dark Sliver'},
    ]
  },

  draw: {
    instructions: "From memory, draw a gibbous Moon — most of the disk lit, with just a thin dark sliver remaining."
  },

  rotate: {
    questions: [
      {rotation:90, flip:false, diagramOpts:{moonPos:135}, prompt:"This gibbous Moon is rotated 90°. Is it still more than half lit?", options:["Yes — rotating the view doesn't change how much is lit","No — rotating changes it to a different phase"], correct:0},
      {rotation:0, flip:true, diagramOpts:{moonPos:225}, prompt:"This waning gibbous is mirrored left-right. Is it still more than half lit?", options:["Yes — mirroring doesn't change how much is lit","No — mirroring changes it to a crescent"], correct:0},
      {rotation:0, flip:false, diagramOpts:{moonPos:90}, prompt:"This shows exactly half lit. Is this still called gibbous?", options:["No — exactly half lit is Quarter, not gibbous","Yes — half lit still counts as gibbous"], correct:0},
    ]
  },

  compare: {
    instructions: "Which one shows a gibbous Moon — more than half lit, but not fully full?",
    leftOpts: {moonPos:135}, rightOpts: {moonPos:90},
    correctSide: 'left',
    correctMsg: "Correct — a gibbous Moon is more than half lit, but not completely full.",
    wrongMsg: "Not quite — that one is exactly half lit, which is Quarter, not gibbous."
  },

  connect: {
    steps: [
      "The Moon's illuminated portion keeps growing after Quarter Moon",
      "More than half of the disk becomes lit",
      "This mostly-lit shape is called gibbous",
      "It keeps growing until Full Moon, then starts shrinking again",
      "These are called waxing gibbous and waning gibbous",
    ]
  },

  explain: {
    prompt: "In your own words: what does a gibbous Moon look like, and when does it happen in the lunar cycle?",
    keywords: ['gibbous','more than half','lit','waxing','waning','full moon'],
    starters: [
      "A gibbous Moon shows ___...",
      "It happens right before or after ___...",
      "The two types of gibbous are ___ and ___..."
    ]
  },

  predict: {
    instructions: "Drag through 8 points of the lunar cycle. Predict which ones show a gibbous Moon (more than half lit).",
    min: 0, max: 7, step: 1,
    getDiagramOpts: (v)=> ({moonPos: Math.round(v)*45}),
    getPhase: (v)=>{
      const pos = Math.round(v) * 45;
      if(pos === 135) return '🌔 Waxing Gibbous — mostly lit, still growing';
      if(pos === 225) return '🌖 Waning Gibbous — mostly lit, now shrinking';
      if(pos === 180) return 'This is Full Moon — completely lit, not gibbous';
      return 'Not a gibbous Moon at this point';
    },
    formatValue: (v)=> 'Cycle point ' + (Math.round(v)+1) + ' of 8'
  },

  badgeText: "Concept Mastered: Gibbous!"
};

/* ============================================================
   ENGINE — do not edit per concept (fix bugs here, not per-file)
   ============================================================ */
document.getElementById('conceptTitle').textContent = `${CONCEPT.icon} ${CONCEPT.title}`;
document.getElementById('conceptSub').textContent = CONCEPT.subtitle;
document.getElementById('badgeText').textContent = CONCEPT.badgeText;

const SAVE_KEY = 'astro_' + CONCEPT.id + '_v1';
let save = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
save.done = save.done || {};
save.xp = save.xp || 0;
function persist(){ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }

const MISSIONS = [
  {id:'observe', icon:'👀', label:'Observe'},
  {id:'label',   icon:'🏷️', label:'Label'},
  {id:'draw',    icon:'✏️', label:'Draw'},
  {id:'rotate',  icon:'🔄', label:'Rotate'},
  {id:'compare', icon:'🔍', label:'Compare'},
  {id:'connect', icon:'🔗', label:'Connect'},
  {id:'explain', icon:'❓', label:'Explain'},
  {id:'predict', icon:'🔮', label:'Predict'},
];
let current = MISSIONS.find(m=>!save.done[m.id])?.id || 'observe';

function markDone(id, xp){
  if(!save.done[id]){ save.done[id]=true; save.xp += xp; persist(); showToast('+'+xp+' XP'); }
  renderRail(); updateXP(); checkAllDone(); appendContinueCTA();
}
const ENCOURAGE_MSGS = [
  "Nice work! You've got this. 🎉", "Awesome — that's locked in! 🌟",
  "You nailed it! Keep the momentum going. 🚀", "Great thinking! On to the next one. 💪",
  "Boom! Mission complete. 🎯"
];
function appendContinueCTA(){
  const stage = document.getElementById('stage');
  if(document.getElementById('continueCTA')) return;
  const nextMission = MISSIONS.find(m=>!save.done[m.id]);
  const msg = ENCOURAGE_MSGS[Math.floor(Math.random()*ENCOURAGE_MSGS.length)];
  const banner = document.createElement('div');
  banner.id = 'continueCTA'; banner.className = 'complete-banner';
  banner.innerHTML = `<p>${msg}</p>` + (nextMission
      ? `<button class="primary-btn" id="nextMissionBtn" style="margin:0;">Continue to ${nextMission.icon} ${nextMission.label} →</button>`
      : `<button class="primary-btn" id="nextMissionBtn" style="margin:0;">🏆 All 8 missions done!</button>`);
  stage.appendChild(banner);
  if(nextMission){ document.getElementById('nextMissionBtn').onclick = ()=>{ current = nextMission.id; renderRail(); renderStage(); }; }
}
function updateXP(){ document.getElementById('xpPill').textContent = '⭐ '+save.xp+' XP'; }
function checkAllDone(){ if(MISSIONS.every(m=>save.done[m.id])){ document.getElementById('badgeBanner').classList.add('show'); } }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1400);
}
function renderRail(){
  const rail = document.getElementById('rail');
  rail.innerHTML = '';
  MISSIONS.forEach(m=>{
    const btn = document.createElement('div');
    btn.className = 'm-btn' + (m.id===current?' active':'') + (save.done[m.id]?' done':'');
    btn.innerHTML = `<div class="ic">${save.done[m.id]?'✅':m.icon}</div><div>${m.label}</div>`;
    btn.onclick = ()=>{ current = m.id; renderRail(); renderStage(); };
    rail.appendChild(btn);
  });
}

/* ---------- shared earth SVG builder (default diagram engine) ---------- */
function earthSVG(opts={}){
  const rot = opts.rotation || 0;
  const flip = opts.flip ? -1 : 1;
  const showArrow = opts.showArrow !== false;
  const showAxis = opts.showAxis !== false;
  const showTerm = opts.showTerm !== false;
  const grid = opts.grid || false;
  const showEquator = opts.showEquator !== undefined ? opts.showEquator : grid;
  const axisAngle = opts.axisAngle || 0;
  const axisLabels = opts.axisLabels !== false;
  const equatorOffset = opts.equatorOffset || 0;
  const hotspots = opts.hotspots || [];
  const sunIcon = opts.sunIcon || false;
  const id = opts.id || 'e';
  return `
  <svg class="earth" viewBox="0 0 200 200" id="${id}" style="transform:rotate(${rot}deg) scaleX(${flip})">
    <defs>
      <clipPath id="dayclip-${id}"><rect x="100" y="0" width="100" height="200"/></clipPath>
      <radialGradient id="glow-${id}" cx="30%" cy="35%" r="75%">
        <stop offset="0%" stop-color="#3a6ea8"/><stop offset="100%" stop-color="#1b3a63"/>
      </radialGradient>
    </defs>
    ${sunIcon ? `<text x="196" y="104" font-size="22" text-anchor="middle">☀️</text>
      <line x1="180" y1="100" x2="182" y2="100" stroke="#FF8B5E" stroke-width="2"/>` : ''}
    <circle cx="100" cy="100" r="78" fill="url(#glow-${id})"/>
    ${showTerm ? `<g clip-path="url(#dayclip-${id})"><circle cx="100" cy="100" r="78" fill="#FF8B5E" opacity="0.85"/></g>` : ''}
    ${!grid ? `<ellipse cx="70" cy="70" rx="20" ry="12" fill="#3F8F5B" opacity="0.8"/>
    <ellipse cx="60" cy="120" rx="16" ry="10" fill="#3F8F5B" opacity="0.8"/>
    <ellipse cx="130" cy="90" rx="14" ry="18" fill="#3F8F5B" opacity="0.55"/>` : ''}
    <circle cx="100" cy="100" r="78" fill="none" stroke="#0B1026" stroke-width="2"/>
    ${grid ? `<g stroke="#8FB8D8" stroke-width="1" opacity="0.65" fill="none">
      <ellipse cx="100" cy="100" rx="78" ry="78"/>
      <ellipse cx="100" cy="63" rx="63" ry="20"/>
      <ellipse cx="100" cy="137" rx="63" ry="20"/>
      <line x1="100" y1="22" x2="100" y2="178"/>
      <ellipse cx="100" cy="100" rx="30" ry="78"/>
      <ellipse cx="100" cy="100" rx="55" ry="78"/>
    </g>` : ''}
    ${showEquator ? `<line x1="22" y1="${100+equatorOffset}" x2="178" y2="${100+equatorOffset}" stroke="#FF8B5E" stroke-width="2" stroke-dasharray="2 3"/>
    <text x="184" y="${104+equatorOffset}" font-size="8" fill="#FF8B5E">Eq</text>` : ''}
    ${showAxis ? `<g transform="rotate(${axisAngle},100,100)">
      <line x1="100" y1="8" x2="100" y2="192" stroke="#F5F0E6" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
      ${axisLabels ? `<text x="100" y="2" text-anchor="middle" font-size="9" fill="#F5F0E6">N</text>
      <text x="100" y="198" text-anchor="middle" font-size="9" fill="#F5F0E6">S</text>` : ''}
    </g>` : ''}
    ${showArrow ? `<path d="M 100 22 A 78 78 0 0 1 170 65" fill="none" stroke="#4ECDC4" stroke-width="3" marker-end="url(#arrowhead-${id})"/>
      <defs><marker id="arrowhead-${id}" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
        <path d="M0,0 L8,4 L0,8 z" fill="#4ECDC4"/></marker></defs>` : ''}
    ${hotspots.map(h=>`
      <g class="hotspot" data-key="${h.key}" transform="translate(${h.x},${h.y})">
        <circle class="ring" r="12"/><circle class="dot" r="5" fill="#F5F0E6"/>
      </g>`).join('')}
  </svg>`;
}
/* Generic diagram dispatcher — lets a CONCEPT supply its own diagramFn (e.g. a compass
   rose or a map icon) instead of the default rotating-Earth globe. Falls back to earthSVG. */
function diagram(opts={}, fn){
  const renderer = fn || CONCEPT.diagramFn || earthSVG;
  return renderer(opts);
}

/* ================= MISSION: OBSERVE ================= */
let observeFound = new Set(JSON.parse(sessionStorage.getItem('obsFound_'+CONCEPT.id)||'[]'));
function renderObserve(){
  const pts = CONCEPT.observe.points;
  const stage = document.getElementById('stage');
  stage.innerHTML = `
    <h2>👀 Observe</h2>
    <p class="instructions">${CONCEPT.observe.instructions}</p>
    <div class="earth-wrap">${diagram({id:'obs', hotspots: pts.map(p=>({key:p.key,x:100+p.x,y:100+p.y}))})}</div>
    <div class="found-list" id="foundList"></div>
  `;
  document.querySelectorAll('#obs .hotspot').forEach(el=>{
    const key = el.dataset.key;
    if(observeFound.has(key)) el.classList.add('found');
    el.onclick = ()=>{
      const point = pts.find(p=>p.key===key);
      showPopup(point.name, point.fact, ()=>{
        observeFound.add(key);
        sessionStorage.setItem('obsFound_'+CONCEPT.id, JSON.stringify([...observeFound]));
        renderObserve();
        if(observeFound.size >= pts.length){ markDone('observe', 10); }
      });
    };
  });
  renderFoundList();
}
function renderFoundList(){
  const pts = CONCEPT.observe.points;
  const list = document.getElementById('foundList');
  list.innerHTML = pts.filter(p=>observeFound.has(p.key)).map(p=>`<div class="found-chip">✓ ${p.name}</div>`).join('') +
    (observeFound.size < pts.length ? `<div class="found-chip" style="opacity:.4;border-style:dashed;">${pts.length-observeFound.size} more to find</div>` : '');
}
function showPopup(title, text, onClose){
  const stage = document.getElementById('stage');
  const p = document.createElement('div');
  p.className = 'popup';
  p.innerHTML = `<h3>${title}</h3><p>${text}</p><button>Got it</button>`;
  p.querySelector('button').onclick = ()=>{ p.remove(); onClose && onClose(); };
  stage.appendChild(p);
}

/* ================= MISSION: LABEL ================= */
let labelPlaced = {};
function renderLabel(){
  const targets = CONCEPT.label.targets;
  const stage = document.getElementById('stage');
  stage.innerHTML = `
    <h2>🏷️ Label</h2>
    <p class="instructions">${CONCEPT.label.instructions}</p>
    <div class="earth-wrap" style="position:relative;">
      ${diagram({id:'lab', showArrow:false, hotspots:[]})}
      <div id="zones" style="position:absolute; inset:0; width:200px; height:200px; left:50%; transform:translateX(-50%);"></div>
    </div>
    <div class="label-pool" id="pool"></div>
  `;
  const zones = document.getElementById('zones');
  targets.forEach(t=>{
    const z = document.createElement('div');
    z.className = 'label-zone' + (labelPlaced[t.key] ? ' filled' : '');
    z.style.left = (t.x-7)+'px'; z.style.top=(t.y-7)+'px';
    z.dataset.key = t.key;
    z.onclick = ()=> tryPlace(t.key);
    zones.appendChild(z);
  });
  const pool = document.getElementById('pool');
  let selected = null;
  targets.forEach(t=>{
    const c = document.createElement('div');
    c.className = 'label-chip' + (labelPlaced[t.key] ? ' used' : '');
    c.textContent = t.name;
    c.onclick = ()=>{ selected = t.key; [...pool.children].forEach(x=>x.style.outline=''); c.style.outline='2px solid #4ECDC4'; };
    pool.appendChild(c);
  });
  window.tryPlace = (zoneKey)=>{
    if(!selected) { showToast('Pick a label first'); return; }
    if(selected === zoneKey){ labelPlaced[selected] = true; showToast('Correct!'); }
    else { showToast('Try again'); }
    selected = null;
    renderLabel();
    if(Object.keys(labelPlaced).length >= targets.length){ markDone('label', 10); }
  };
}

/* ================= MISSION: DRAW ================= */
function renderDraw(){
  const stage = document.getElementById('stage');
  stage.innerHTML = `
    <h2>✏️ Draw</h2>
    <p class="instructions">${CONCEPT.draw.instructions}</p>
    <div class="canvas-wrap"><canvas id="drawCanvas" width="600" height="420"></canvas></div>
    <div class="draw-tools"><button id="clearBtn">Clear</button><button id="revealBtn">Reveal reference</button></div>
    <button class="primary-btn" id="finishDrawBtn">I'm finished drawing</button>
  `;
  const canvas = document.getElementById('drawCanvas');
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#0E1330'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle = '#F5F0E6'; ctx.lineWidth = 4; ctx.lineCap='round'; ctx.lineJoin='round';
  let drawing = false;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const cx = (e.touches? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches? e.touches[0].clientY : e.clientY) - r.top;
    return {x: cx * canvas.width/r.width, y: cy * canvas.height/r.height};
  }
  function start(e){ drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); }
  function end(){ drawing = false; }
  canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); canvas.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false}); canvas.addEventListener('touchmove', move, {passive:false}); canvas.addEventListener('touchend', end);
  document.getElementById('clearBtn').onclick = ()=>{ ctx.fillStyle='#0E1330'; ctx.fillRect(0,0,canvas.width,canvas.height); };
  document.getElementById('revealBtn').onclick = ()=>{
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(11,16,38,0.75);z-index:5;';
    overlay.innerHTML = `<div style="text-align:center;">${diagram({id:'ref'})}<p style="font-size:0.8rem;color:#C7CDF0;">Reference — tap anywhere to close</p></div>`;
    overlay.onclick = ()=> overlay.remove();
    stage.appendChild(overlay);
  };
  document.getElementById('finishDrawBtn').onclick = ()=>{
    markDone('draw', 10);
  };
}

/* ================= MISSION: ROTATE ================= */
let rotateIdx = 0, rotateScore = 0;
function renderRotate(){
  const Q = CONCEPT.rotate.questions;
  const stage = document.getElementById('stage');
  const q = Q[rotateIdx];
  stage.innerHTML = `
    <h2>🔄 Rotate</h2>
    <p class="instructions">${q.prompt}</p>
    <div class="earth-wrap">${diagram({id:'rot', rotation:q.rotation, flip:q.flip, showArrow:q.showArrow, sunIcon:q.sunIcon, ...(q.diagramOpts||{})})}</div>
    <div class="mc-options" id="mcOpts"></div>
    <p style="text-align:center;font-size:0.75rem;color:#8A92C7;margin-top:10px;">Question ${rotateIdx+1} of ${Q.length}</p>
  `;
  const opts = document.getElementById('mcOpts');
  q.options.forEach((opt,i)=>{
    const b = document.createElement('div'); b.className = 'mc-opt'; b.textContent = opt;
    b.onclick = ()=>{
      [...opts.children].forEach(c=>c.onclick=null);
      if(i===q.correct){ b.classList.add('correct'); rotateScore++; }
      else { b.classList.add('wrong'); opts.children[q.correct].classList.add('correct'); }
      setTimeout(()=>{
        if(rotateIdx < Q.length-1){ rotateIdx++; renderRotate(); }
        else { markDone('rotate', 15); showToast(`Score: ${rotateScore}/${Q.length}`); }
      }, 900);
    };
    opts.appendChild(b);
  });
}

/* ================= MISSION: COMPARE ================= */
function renderCompare(){
  const cfg = CONCEPT.compare;
  const stage = document.getElementById('stage');
  stage.innerHTML = `
    <h2>🔍 Compare</h2>
    <p class="instructions">${cfg.instructions}</p>
    <div class="compare-row" id="cRow">
      <div class="compare-card" data-v="left">${diagram({id:'cmpA', ...cfg.leftOpts}, cfg.leftFn)}</div>
      <div class="compare-card" data-v="right">${diagram({id:'cmpB', ...cfg.rightOpts}, cfg.rightFn)}</div>
    </div>
  `;
  document.querySelectorAll('.compare-card').forEach(card=>{
    card.onclick = ()=>{
      document.querySelectorAll('.compare-card').forEach(c=>c.onclick=null);
      const picked = card.dataset.v;
      if(picked === cfg.correctSide){ card.classList.add('picked-correct'); showToast(cfg.correctMsg); markDone('compare', 10); }
      else {
        card.classList.add('picked-wrong');
        document.querySelector(`[data-v="${cfg.correctSide}"]`).classList.add('picked-correct');
        showToast(cfg.wrongMsg);
        markDone('compare', 5);
      }
    };
  });
}

/* ================= MISSION: CONNECT ================= */
let chainOrder = [];
let chainPool = null;
let chainHint = '';
function renderConnect(){
  const STEPS = CONCEPT.connect.steps;
  if(!chainPool) chainPool = [...STEPS].sort(()=>Math.random()-0.5);
  const stage = document.getElementById('stage');
  stage.innerHTML = `
    <h2>🔗 Connect</h2>
    <p class="instructions">Tap the chips below in the correct cause → effect order. Tap a filled slot to undo it.</p>
    <div class="chain-pool" id="slots"></div>
    <div class="hint-text" id="chainHint">${chainHint}</div>
    <div class="chip-row" id="chips"></div>
  `;
  const slots = document.getElementById('slots');
  STEPS.forEach((_,i)=>{
    const s = document.createElement('div');
    const filled = !!chainOrder[i];
    s.className = 'chain-slot' + (filled ? ' filled' : '');
    if(filled){
      s.innerHTML = `<span>${i+1}. ${chainOrder[i]}</span>` + (i === chainOrder.length-1 ? `<span class="undo">undo</span>` : '');
      if(i === chainOrder.length-1){ s.querySelector('.undo').onclick = (e)=>{ e.stopPropagation(); chainOrder.pop(); chainHint=''; renderConnect(); }; }
    } else { s.textContent = `${i+1}. ...`; }
    slots.appendChild(s);
  });
  const chips = document.getElementById('chips');
  chainPool.forEach(step=>{
    const c = document.createElement('div');
    c.className = 'chain-chip' + (chainOrder.includes(step) ? ' used' : '');
    c.textContent = step;
    c.onclick = ()=>{
      if(chainOrder.includes(step)) return;
      const expected = STEPS[chainOrder.length];
      if(step === expected){
        chainOrder.push(step); chainHint = ''; renderConnect();
        if(chainOrder.length === STEPS.length){ showToast('Perfect chain!'); markDone('connect', 15); }
      } else {
        c.classList.add('wrong-flash');
        chainHint = `Not quite — think about what has to happen right after step ${chainOrder.length}.`;
        document.getElementById('chainHint').textContent = chainHint;
        setTimeout(()=> c.classList.remove('wrong-flash'), 500);
      }
    };
    chips.appendChild(c);
  });
}

/* ================= MISSION: EXPLAIN ================= */
function insertKeyword(word){
  const box = document.getElementById('explainBox');
  if(!box) return;
  if(box.value.includes('___')){ box.value = box.value.replace('___', word); }
  else {
    const start = box.selectionStart ?? box.value.length;
    const end = box.selectionEnd ?? box.value.length;
    box.value = box.value.slice(0,start) + word + box.value.slice(end);
  }
  box.focus();
}
function renderExplain(){
  const cfg = CONCEPT.explain;
  const stage = document.getElementById('stage');
  stage.innerHTML = `
    <h2>❓ Explain</h2>
    <p class="instructions">${cfg.prompt} The words below are keywords you can use — you don't have to use all of them, and it's great to add your own words too!</p>
    <div class="starter-row" id="starterRow"></div>
    <textarea id="explainBox" placeholder="Start typing... or tap a sentence starter above"></textarea>
    <p class="kw-hint">💡 Keywords you can tap to fill in blanks (no need to use them all):</p>
    <div class="keyword-row" id="kwRow"></div>
    <button class="primary-btn" id="submitExplain">Check my explanation</button>
  `;
  const starterRow = document.getElementById('starterRow');
  cfg.starters.forEach(s=>{
    const b = document.createElement('div'); b.className='starter-chip'; b.textContent = s;
    b.onclick = ()=>{
      const box = document.getElementById('explainBox');
      box.value = (box.value ? box.value + ' ' : '') + s.replace('...', '');
      box.focus();
    };
    starterRow.appendChild(b);
  });
  const kwRow = document.getElementById('kwRow');
  cfg.keywords.forEach(k=>{
    const s = document.createElement('div'); s.className='kw'; s.dataset.k=k; s.textContent=k;
    s.onclick = ()=> insertKeyword(k);
    kwRow.appendChild(s);
  });
  document.getElementById('submitExplain').onclick = ()=>{
    const text = document.getElementById('explainBox').value.toLowerCase();
    let hits = 0;
    cfg.keywords.forEach(k=>{
      const el = document.querySelector(`.kw[data-k="${k}"]`);
      if(text.includes(k)){ el.classList.add('hit'); hits++; }
    });
    showToast(`Nice — you used ${hits}/${cfg.keywords.length} keywords`);
    if(hits >= 3){ markDone('explain', 15); }
    else { showToast('Try adding a couple more ideas, in your own words or with a keyword'); }
  };
}

/* ================= MISSION: PREDICT ================= */
function renderPredict(){
  const cfg = CONCEPT.predict;
  const min = cfg.min !== undefined ? cfg.min : 0;
  const max = cfg.max !== undefined ? cfg.max : 24;
  const step = cfg.step !== undefined ? cfg.step : 1;
  const stage = document.getElementById('stage');
  stage.innerHTML = `
    <h2>🔮 Predict</h2>
    <p class="instructions">${cfg.instructions}</p>
    <div class="earth-wrap" style="position:relative;" id="predWrap">
      ${diagram({id:'pred', showArrow:false, sunIcon:true})}
      ${cfg.getDiagramOpts ? '' : '<div id="pin" style="position:absolute; width:10px; height:10px; border-radius:50%; background:#F5F0E6; border:2px solid #0B1026;"></div>'}
    </div>
    <div class="phase-label" id="phaseLabel">—</div>
    <div class="time-readout" id="timeReadout">00:00</div>
    <div class="slider-row"><span>🌙</span><input type="range" id="hourSlider" min="${min}" max="${max}" step="${step}" value="${min}"><span>☀️</span></div>
    <button class="primary-btn" id="predictDoneBtn">I understand this — complete</button>
  `;
  const slider = document.getElementById('hourSlider');
  function update(){
    const h = parseFloat(slider.value);
    if(cfg.getDiagramOpts){
      document.getElementById('predWrap').innerHTML = diagram(Object.assign({id:'pred', showArrow:false, sunIcon:true}, cfg.getDiagramOpts(h)));
    } else {
      const angle = (h/24) * 360;
      document.getElementById('pred').style.transform = `rotate(${angle}deg)`;
      const rad = (angle-90) * Math.PI/180;
      const r = 78;
      const cx = 100 + r*Math.cos(rad), cy = 100 + r*Math.sin(rad);
      const pin = document.getElementById('pin');
      if(pin){ pin.style.position = 'absolute'; pin.style.left = (cx-5)+'px'; pin.style.top = (cy-5)+'px'; }
    }
    document.getElementById('timeReadout').textContent = cfg.formatValue ? cfg.formatValue(h) : String(Math.round(h)).padStart(2,'0')+':00';
    document.getElementById('phaseLabel').textContent = cfg.getPhase(h);
  }
  slider.oninput = update; update();
  document.getElementById('predictDoneBtn').onclick = ()=> markDone('predict', 15);
}

/* ---------- stage router ---------- */
function renderStage(){
  const map = { observe: renderObserve, label: renderLabel, draw: renderDraw, rotate: renderRotate,
    compare: renderCompare, connect: renderConnect, explain: renderExplain, predict: renderPredict };
  map[current]();
}

/* ---------- starfield bg ---------- */
(function(){
  const c = document.getElementById('stars');
  function resize(){ c.width = innerWidth; c.height = innerHeight; }
  resize(); window.addEventListener('resize', resize);
  const ctx = c.getContext('2d');
  const stars = Array.from({length:80}, ()=>({x:Math.random()*innerWidth, y:Math.random()*innerHeight, r:Math.random()*1.3+0.3}));
  ctx.fillStyle = '#F5F0E6';
  stars.forEach(s=>{ ctx.globalAlpha = Math.random()*0.6+0.2; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill(); });
})();

/* ---------- init ---------- */
renderRail(); renderStage(); updateXP(); checkAllDone();
</script>
